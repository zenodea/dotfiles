#? Config file for btop v.1.4.7
#? Linked from the dotfiles. btop would rewrite this file on exit with every option
#? it knows; save_config_on_exit = False keeps it as written, so change settings here.
#? Anything not set here is btop's default.

color_theme = "dotfiles"

#* No theme background: the terminal's own (and its opacity) shows through.
theme_background = False

truecolor = True

#* h j k l g G move in lists, as in nvim.
vim_keys = True

rounded_corners = True

update_ms = 1000

save_config_on_exit = False
