# lazygit — mostly defaults; see `lazygit --config` for the full set.

# `e` reuses the launching Neovim, or the project's editor in a sibling Rex
# pane. rex-edit starts a normal Neovim when no matching editor is running.
os:
  edit: 'if [ -z "$NVIM" ]; then rex-edit -- {{filename}}; else nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote-send "<C-\><C-N>:LazygitEdit 0 {{filename}}<CR>"; fi'
  editAtLine: 'if [ -z "$NVIM" ]; then rex-edit +{{line}} -- {{filename}}; else nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote-send "<C-\><C-N>:LazygitEdit {{line}} {{filename}}<CR>"; fi'
  openDirInEditor: 'if [ -z "$NVIM" ]; then rex-edit -- {{dir}}; else nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote-send "<C-\><C-N>:LazygitEdit 0 {{dir}}<CR>"; fi'
  # Blocking by design — lazygit waits on this one (e.g. rewording a commit),
  # so it has to stay in the foreground rather than hand off and return.
  editAtLineAndWait: 'nvim +{{line}} -- {{filename}}'

git:
  # Lazygit 0.65 exposes columnWidth (half the pane width minus 6), not width.
  # Reconstruct the full width and keep tiny panes valid for delta and seq.
  diffRenderers:
    - name: delta
      command: >-
        width=$(({{columnWidth}} * 2 + 12));
        [ "$width" -ge 1 ] || width=1;
        max_line_length=$((width - 16));
        [ "$max_line_length" -ge 1 ] || max_line_length=1;
        delta --paging=never --width="$width" --max-line-length="$max_line_length"
        | sed "s/^---\$/$(printf '\033[2m'; printf '─%.0s' $(seq 1 "$width"); printf '\033[0m')/"
    - name: delta full
      command: >-
        width=$(({{columnWidth}} * 2 + 12));
        [ "$width" -ge 1 ] || width=1;
        delta --paging=never --width="$width"
        | sed "s/^---\$/$(printf '\033[2m'; printf '─%.0s' $(seq 1 "$width"); printf '\033[0m')/"

gui:
  theme:
    activeBorderColor: ['#${ACCENT}', bold]
    inactiveBorderColor: ['#${BORDER}']
    searchingActiveBorderColor: ['#${YELLOW}', bold]
    optionsTextColor: ['#${MUTED}']
    selectedLineBgColor: ['#${BG_ALT}']
    inactiveViewSelectedLineBgColor: ['#${SURFACE}']
    cherryPickedCommitFgColor: ['#${BLUE}']
    cherryPickedCommitBgColor: ['#${BG_ALT}']
    markedBaseCommitFgColor: ['#${YELLOW}']
    markedBaseCommitBgColor: ['#${BG_ALT}']
    unstagedChangesColor: ['#${RED}']
    defaultFgColor: ['#${FG}']
  nerdFontsVersion: "3"
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  showRandomTip: false
  showCommandLog: false
  showBottomLine: false
  showPanelJumps: false
  sidePanelWidth: 0.2
  expandFocusedSidePanel: true
  screenMode: normal
  scrollHeight: 15

keybinding:
  universal:
    jumpToBlock: ["<disabled>", "1", "2", "3", "4"]
    cycleDiffRenderers: <c-f>
  files:
    findBaseCommitForFixup: <disabled>

customCommands:
  - key: U
    context: commits
    description: diff everything unpushed
    command: git diff @{upstream}..HEAD
    subprocess: true
