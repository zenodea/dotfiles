# lazygit — mostly defaults; see `lazygit --config` for the full set.

# `e` on a file opens it in the nvim that launched lazygit instead of nesting a
# second nvim inside the terminal buffer. This is the built-in `nvim-remote`
# preset with one change: it uses --remote-tab, which strands the file in a new
# tab away from an acp.nvim workspace, so instead the path is handed to
# :LazygitEdit (defined in the lazygit.nvim spec in nvim's plugins/coding.lua)
# which reuses a code window in the current tab.
#
# Each still falls back to a plain nvim when $NVIM is unset, i.e. when lazygit
# is run from a normal shell rather than from inside nvim.
os:
  edit: '[ -z "$NVIM" ] && nvim -- {{filename}} || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote-send "<C-\><C-N>:LazygitEdit 0 {{filename}}<CR>")'
  editAtLine: '[ -z "$NVIM" ] && nvim +{{line}} -- {{filename}} || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote-send "<C-\><C-N>:LazygitEdit {{line}} {{filename}}<CR>")'
  openDirInEditor: '[ -z "$NVIM" ] && nvim -- {{dir}} || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote-send "<C-\><C-N>:LazygitEdit 0 {{dir}}<CR>")'
  # Blocking by design — lazygit waits on this one (e.g. rewording a commit),
  # so it has to stay in the foreground rather than hand off and return.
  editAtLineAndWait: 'nvim +{{line}} -- {{filename}}'

git:
  diffRenderers:
    - name: delta
      command: delta --paging=never --width={{width}} --max-line-length=$(({{width}}-16)) | sed "s/^---\$/$(printf '\033[2m'; printf '─%.0s' $(seq 1 {{width}}); printf '\033[0m')/"
    - name: delta full
      command: delta --paging=never --width={{width}} | sed "s/^---\$/$(printf '\033[2m'; printf '─%.0s' $(seq 1 {{width}}); printf '\033[0m')/"

gui:
  theme:
    activeBorderColor: ['#${ACCENT}', bold]
    inactiveBorderColor: ['#${BORDER}']
    searchingActiveBorderColor: ['#${YELLOW}', bold]
    optionsTextColor: ['#${MUTED}']
    selectedLineBgColor: ['#${BG_ALT}']
    inactiveViewSelectedLineBgColor: ['#${SURFACE}']
    cherryPickedCommitFgColor: ['#${BLUE}']
    cherryPickedCommitBgColor: ['#${BG_ALT}']
    markedBaseCommitFgColor: ['#${YELLOW}']
    markedBaseCommitBgColor: ['#${BG_ALT}']
    unstagedChangesColor: ['#${RED}']
    defaultFgColor: ['#${FG}']
  nerdFontsVersion: "3"
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  showRandomTip: false
  showCommandLog: false
  showBottomLine: false
  showPanelJumps: false
  sidePanelWidth: 0.2
  expandFocusedSidePanel: true
  screenMode: normal
  scrollHeight: 15

keybinding:
  universal:
    jumpToBlock: ["<disabled>", "1", "2", "3", "4"]
    cycleDiffRenderers: <c-f>
  files:
    findBaseCommitForFixup: <disabled>

customCommands:
  - key: U
    context: commits
    description: diff everything unpushed
    command: git diff @{upstream}..HEAD
    subprocess: true
