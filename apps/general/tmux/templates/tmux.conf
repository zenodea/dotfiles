# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind - split-window -h
bind _ split-window -v
unbind '"'
unbind %

# tmux vim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -gq allow-passthrough on
set -g focus-events on
set -g visual-activity off

bind-key x kill-pane
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind-key b set -g status
bind-key S setw synchronize-panes
bind-key f display-popup -E -w 60% -h 50% -T "sessions" "~/.config/tmux/scripts/sessionizer.sh"

set -g renumber-windows on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# popups
bind-key l display-popup -w 90% -h 90% -T "lazygit" -d "#{pane_current_path}" "tmux new-session -A -s lazygit lazygit"
bind-key L kill-session -t lazygit \; display-message "Lazygit session killed"
bind-key j display-popup -w 90% -h 90% -T "codex" -d "#{pane_current_path}" "tmux new-session -A -s codex codex"
bind-key J kill-session -t codex \; display-message "Codex session killed"
bind-key k display-popup -w 90% -h 90% -T "claude" -d "#{pane_current_path}" "tmux new-session -A -s claude claude"
bind-key K kill-session -t claude \; display-message "Claude session killed"

# --- status bar ---------------------------------------------------------------

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#${FG}"
set -g status-left-length 40
set -g status-right-length 100

# Fixed-width chips: ^A lights up on prefix, session turns purple in copy mode.
set -g status-left "#{?client_prefix,#[fg=#${BG}#,bg=#${ORANGE}#,bold],#[fg=#${MUTED}#,bg=#${SURFACE}]} ^A #{?pane_in_mode,#[fg=#${BG}#,bg=#${PURPLE}#,bold],#[fg=#${BG}#,bg=#${ACCENT}#,bold]} #S #[fg=default,bg=default] "

setw -g monitor-activity on
set -g activity-action none
light="#{?window_bell_flag,#[fg=#${RED}#,bold]● ,#{?window_activity_flag,#[fg=#${YELLOW}]● ,}}"
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{m:*vim,#{pane_current_command}}, #{b:pane_current_path},#{?#{m:lazygit,#{pane_current_command}},󰊢 lazygit,#{?#{m:ssh,#{pane_current_command}},󰣀 ssh,#{?#{m:*sh,#{pane_current_command}}, #{b:pane_current_path}, #{pane_current_command}}}}}"
set -g window-status-separator ""
set -g window-status-format "#[fg=#${MUTED}] #I $light#[fg=#${MUTED}]#W "
set -g window-status-current-format "#[fg=#${ACCENT},bold] #I $light#[fg=#${ACCENT},bold]#W#{?window_zoomed_flag, 󰍉,} "
set -g window-status-activity-style "none"
set -g window-status-bell-style "none"

set -g status-right "#{?pane_synchronized,#[fg=#${BG}#,bg=#${RED}#,bold] SYNC #[fg=default#,bg=default] ,}#(~/.config/tmux/scripts/popups.sh)#[fg=#${MUTED}] #{b:pane_current_path}#(~/.config/tmux/scripts/git.sh '#{pane_current_path}') #[fg=#${BORDER}]│#[fg=#${YELLOW}] 󰥔 %H:%M #[fg=#${BORDER}]│#[fg=#${BLUE}]  %a %d %b #[fg=#${BORDER}]│#[fg=#${GREEN}] 󰇅 #h #[fg=#${BORDER}]│#[fg=#${FG_BRIGHT},bold] 勢之 "

set -g pane-border-lines single
set -g pane-border-style "fg=#${BORDER}"
set -g pane-active-border-style "fg=#${ACCENT}"
set -g display-panes-colour "#${BORDER}"
set -g display-panes-active-colour "#${ACCENT}"
set -g message-style "bg=#${SURFACE},fg=#${FG_BRIGHT}"
set -g message-command-style "bg=#${SURFACE},fg=#${YELLOW}"
set -g mode-style "bg=#${BG_ALT},fg=#${FG_BRIGHT}"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#${ACCENT}"
set -g clock-mode-colour "#${ACCENT}"
set -g clock-mode-style 24
